<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F0F1A"/>
    </radialGradient>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#E53935"/>
      <stop offset="33%"  stop-color="#F5C842"/>
      <stop offset="67%"  stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2196F3"/>
    </linearGradient>
    <linearGradient id="glow-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="round">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle purple glow center -->
  <ellipse cx="256" cy="200" rx="220" ry="160" fill="rgba(147,51,234,0.12)"/>

  <!-- Rainbow arc (roof) -->
  <path d="M 72 272 Q 256 56 440 272" stroke="url(#arc)" stroke-width="18" fill="none"
    stroke-linecap="round" filter="url(#blur-glow)" opacity="0.9"/>

  <!-- Thinner crisp arc on top -->
  <path d="M 80 272 Q 256 68 432 272" stroke="url(#arc)" stroke-width="6" fill="none"
    stroke-linecap="round" opacity="1"/>

  <!-- House body glass -->
  <rect x="140" y="265" width="232" height="176" rx="12"
    fill="rgba(255,255,255,0.08)"
    stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Door -->
  <rect x="220" y="335" width="72" height="106" rx="10"
    fill="rgba(255,255,255,0.90)"/>

  <!-- Door handle -->
  <circle cx="278" cy="390" r="5" fill="rgba(15,15,26,0.35)"/>

  <!-- Left window -->
  <rect x="156" y="285" width="60" height="50" rx="8"
    fill="rgba(255,255,255,0.85)"/>
  <line x1="186" y1="285" x2="186" y2="335" stroke="rgba(15,15,26,0.12)" stroke-width="1.5"/>
  <line x1="156" y1="310" x2="216" y2="310" stroke="rgba(15,15,26,0.12)" stroke-width="1.5"/>

  <!-- Right window -->
  <rect x="296" y="285" width="60" height="50" rx="8"
    fill="rgba(255,255,255,0.85)"/>
  <line x1="326" y1="285" x2="326" y2="335" stroke="rgba(15,15,26,0.12)" stroke-width="1.5"/>
  <line x1="296" y1="310" x2="356" y2="310" stroke="rgba(15,15,26,0.12)" stroke-width="1.5"/>

  <!-- Glass reflection on top (shine) -->
  <rect width="512" height="512" rx="112" fill="url(#glow-top)" opacity="0.5"/>

  <!-- "F" on door -->
  <text x="256" y="421"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="48"
    font-weight="700"
    fill="rgba(15,15,26,0.6)"
    text-anchor="middle"
    dominant-baseline="alphabetic">F</text>
</svg>
