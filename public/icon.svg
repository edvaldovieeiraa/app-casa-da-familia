<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#2D2D4E"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#E53935"/>
      <stop offset="33%"  stop-color="#F5C842"/>
      <stop offset="67%"  stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2196F3"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle grid texture -->
  <rect width="512" height="512" rx="96"
    fill="none"
    stroke="rgba(255,255,255,0.04)"
    stroke-width="40"
    stroke-dasharray="2 18"/>

  <!-- House body -->
  <rect x="112" y="268" width="288" height="188" rx="10" fill="rgba(255,255,255,0.10)"/>

  <!-- Colorful roof (triangle) -->
  <polygon points="256,78 82,272 430,272" fill="url(#roof)" filter="url(#shadow)"/>

  <!-- Chimney -->
  <rect x="308" y="134" width="32" height="80" rx="5" fill="rgba(255,255,255,0.20)"/>

  <!-- Door -->
  <rect x="220" y="346" width="72" height="110" rx="10" fill="rgba(255,255,255,0.92)"/>

  <!-- Door knob -->
  <circle cx="280" cy="404" r="5" fill="rgba(26,26,46,0.4)"/>

  <!-- Left window -->
  <rect x="132" y="298" width="62" height="54" rx="8" fill="rgba(255,255,255,0.88)"/>
  <line x1="163" y1="298" x2="163" y2="352" stroke="rgba(26,26,46,0.12)" stroke-width="1.5"/>
  <line x1="132" y1="325" x2="194" y2="325" stroke="rgba(26,26,46,0.12)" stroke-width="1.5"/>

  <!-- Right window -->
  <rect x="318" y="298" width="62" height="54" rx="8" fill="rgba(255,255,255,0.88)"/>
  <line x1="349" y1="298" x2="349" y2="352" stroke="rgba(26,26,46,0.12)" stroke-width="1.5"/>
  <line x1="318" y1="325" x2="380" y2="325" stroke="rgba(26,26,46,0.12)" stroke-width="1.5"/>

  <!-- "F" on door -->
  <text x="256" y="432"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="52"
    font-weight="700"
    fill="#1A1A2E"
    text-anchor="middle"
    dominant-baseline="alphabetic"
    opacity="0.7">F</text>
</svg>
